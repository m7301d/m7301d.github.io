<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pasture</title>
<meta name="description" content="Matt's plot of internet land — projects, photography, homelab, and a tiki bar.">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    /* golden-hour day */
    --sky-hi:#FBD9A0; --sky-lo:#F2A65A; --sun:#FFE08A; --sun-glow:rgba(255,210,120,.55);
    --bg:#F4B96A;
    --ground:#6FAE47; --ground2:#5C9A3C; --dirt:#9A6B3A; --path:#D9B879;
    --barn:#CE4A33; --roof:#9E3320; --door:#7A2A1E; --window:#FFD56B;
    --silo:#CFC8B4; --silo-top:#A39B86; --fence:#C9A55E;
    --wood:#9A6238; --wood-dark:#6F4424; --leaf:#2F7D3A; --water:#4E9FC9;
    --crop:#7FB23E; --crop2:#5C8A2E;
    --text:#2C2118; --panel:#F3E4C0; --panel-border:#8A5A2B; --accent:#CE4A33;
    --online:#2F9E5E; --degraded:#E0A33A; --offline:#CE4A33;
    --ink-soft:#6E5B43;
  }
  @media(prefers-color-scheme:dark){:root{
    /* night farm */
    --sky-hi:#1b1f3a; --sky-lo:#2a2342; --sun:#ffe9a8; --sun-glow:rgba(255,233,168,.25);
    --bg:#16182a;
    --ground:#2d5a1e; --ground2:#264d19; --dirt:#4a3520; --path:#7a6a40;
    --barn:#cc3333; --roof:#881818; --door:#662222; --window:#ffee88;
    --silo:#8a8478; --silo-top:#66625a; --fence:#aa9966;
    --wood:#6B4520; --wood-dark:#4f3318; --leaf:#1d5220; --water:#2f7aa8;
    --crop:#4a7a28; --crop2:#3a5e20;
    --text:#ece4cf; --panel:#221f2e; --panel-border:#9a8a66; --accent:#ffcc55;
    --online:#46d27e; --degraded:#f0c04a; --offline:#ff6a52;
    --ink-soft:#b7ab8c;
  }}

  html,body{min-height:100%}
  body{
    background:linear-gradient(180deg,var(--sky-hi) 0%,var(--sky-lo) 60%,var(--ground) 60%,var(--ground) 100%);
    background-attachment:fixed;
    font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    -webkit-font-smoothing:antialiased;
  }

  header{width:100%;max-width:1000px;padding:22px 18px 4px;text-align:center}
  header h1{
    font-size:clamp(22px,5.5vw,40px);letter-spacing:.22em;text-transform:uppercase;
    font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .almanac{
    margin-top:8px;display:inline-flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
  }
  .almanac b{font-weight:700;color:var(--text)}
  .dot{font-size:13px;line-height:1;vertical-align:middle}
  .dot.online{color:var(--online)} .dot.degraded{color:var(--degraded)} .dot.offline{color:var(--offline)}

  .map-wrap{width:100%;max-width:1000px;padding:6px 12px 10px;position:relative}
  svg.scene{width:100%;height:auto;display:block;image-rendering:pixelated;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.18))}

  .hint{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding-bottom:8px}

  /* hotspots */
  .hotspot{cursor:pointer}
  .hotspot .hit{fill:transparent}
  .hotspot .label{opacity:0;transition:opacity .14s ease;pointer-events:none}
  .hotspot .label text{font-family:inherit;font-weight:700;letter-spacing:.1em}
  .hotspot:hover .label,.hotspot:focus-visible .label,.hotspot.peek .label{opacity:1}
  .hotspot:hover .building,.hotspot:focus-visible .building{
    filter:brightness(1.08) drop-shadow(0 0 7px var(--sun-glow))}
  .hotspot:focus{outline:none}
  .hotspot:focus-visible .hit{stroke:var(--accent);stroke-width:3;stroke-dasharray:6 5}

  @media (prefers-reduced-motion: no-preference){
    .cloud{animation:drift linear infinite}
    #c1{animation-duration:90s} #c2{animation-duration:130s}
    @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(1100px)}}
    .ws-light.online{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    .duck{animation:bob 3.2s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  }

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,12,4,.55);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:3px solid var(--panel-border);
    box-shadow:0 18px 50px rgba(0,0,0,.4);max-width:460px;width:100%;padding:24px 24px 22px;
    position:relative;animation:rise .16s ease}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion: reduce){.modal{animation:none}}
  .modal .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .modal h2{font-size:21px;letter-spacing:.06em;text-transform:uppercase;margin:5px 0 12px;font-weight:800}
  .modal p{font-size:13px;line-height:1.75;color:var(--text);margin-bottom:14px}
  .modal .close{position:absolute;top:10px;right:12px;background:none;border:none;
    font-family:inherit;font-size:18px;font-weight:800;color:var(--ink-soft);cursor:pointer;line-height:1}
  .modal .close:hover{color:var(--accent)}
  .modal .close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* readout (workshop) */
  .readout{border-top:1px dashed var(--panel-border);padding-top:12px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;letter-spacing:.04em}
  .row .nm{flex:1}
  .row .meter{width:64px;height:8px;background:rgba(0,0,0,.14);border:1px solid var(--panel-border);position:relative}
  .row .meter span{position:absolute;inset:0;background:var(--online);width:0}
  .row .val{width:42px;text-align:right;color:var(--ink-soft);font-size:11px}
  .stamp{font-size:10px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:14px}

  .links{display:flex;flex-wrap:wrap;gap:10px}
  .btn{display:inline-block;padding:9px 16px;font-family:inherit;font-weight:800;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none;border:2px solid var(--accent)}
  .btn.solid{background:var(--accent);color:var(--panel)}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--panel-border)}
  .btn.disabled{opacity:.45;cursor:not-allowed;border-color:var(--panel-border);color:var(--ink-soft)}
  .btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}

  footer{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    padding:6px 0 22px;text-align:center;opacity:.9}
</style>
</head>
<body>

</svg>

<div class="hint">Click a building &middot; or press Tab then Enter</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="mClose" aria-label="Close">&times;</button>
    <div class="eyebrow" id="mTag"></div>
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
  </div>
</div>

<footer>the-pasture.org &middot; Matt's plot of internet land</footer>

<script>
/* ---- content. each section returns a body() HTML string. ---- */
const LINKS = { github:"https://github.com/m7301d", email:"matthewlukowski98@gmail.com" };

const SECTIONS = {
  barn:{ tag:"Plant dashboard", title:"The Barn",
    body:()=>`<div class="links"><span class="btn disabled" aria-disabled="true">Coming soon</span></div>` },
  silo:{ tag:"Projects", title:"The Silo",
    body:()=>`<div class="links"><a class="btn ghost" href="${LINKS.github}" target="_blank" rel="noopener">GitHub &rarr;</a></div>` },
  field:{ tag:"Photography", title:"The Field",
    body:()=>`<div class="links"><span class="btn disabled" aria-disabled="true">Coming soon</span></div>` },
  workshop:{ tag:"Homelab status", title:"The Workshop",
    body:()=>renderWorkshop() },
  tiki:{ tag:"AI bartender", title:"The Tiki Hut",
    body:()=>`<div class="links"><span class="btn disabled" aria-disabled="true">Coming soon</span></div>` },
  pond:{ tag:"About", title:"The Pond",
    body:()=>`<div class="links"><span class="btn disabled" aria-disabled="true">Coming soon</span></div>` },
  mailbox:{ tag:"Contact", title:"The Mailbox",
    body:()=>`<div class="links">
        <a class="btn solid" href="mailto:${LINKS.email}">Email</a>
        <a class="btn ghost" href="${LINKS.github}" target="_blank" rel="noopener">GitHub</a>
      </div>` }
};

/* ---- live homelab status ----
   CONTRACT: GET status.json ->
   {
     "updated": "2026-06-19T16:30:00Z",
     "machines": [{ "name":"Mac Mini", "online":true, "disk_pct":38, "uptime":"12d" }, ...],
     "services": [{ "name":"Pi-hole", "online":true }, ...]
   }
   The Workshop light + header indicator derive from this. No file? -> demo below. */
const DEMO_STATUS = {
  updated: null, demo:true,
  machines:[
    {name:"Mac Mini", online:true, disk_pct:38, uptime:"12d"},
    {name:"Synology NAS", online:true, disk_pct:61, uptime:"88d"}
  ],
  services:[ {name:"Pi-hole", online:true}, {name:"Tailscale", online:true} ]
};
let STATUS = DEMO_STATUS;

function overall(s){
  const all=[...(s.machines||[]),...(s.services||[])];
  if(!all.length) return "degraded";
  if(all.every(x=>x.online)) return "online";
  if(all.some(x=>x.online)) return "degraded";
  return "offline";
}
function applyStatus(s){
  STATUS=s;
  const state=overall(s);
  const light=document.getElementById('wsLight');
  light.setAttribute('fill', state==='online'?'var(--online)':state==='offline'?'var(--offline)':'var(--degraded)');
  light.classList.toggle('online', state==='online');
  const dot=document.getElementById('hlDot'), txt=document.getElementById('hlText');
  dot.className='dot '+state;
  txt.textContent = state==='online'?'online':state==='offline'?'down':'degraded';
}
async function loadStatus(){
  try{
    const r=await fetch('status.json',{cache:'no-store'});
    if(r.ok){ applyStatus(await r.json()); return; }
  }catch(e){}
  applyStatus(DEMO_STATUS);
}
function renderWorkshop(){
  const s=STATUS, items=[...(s.machines||[]).map(m=>({...m,meter:true})),...(s.services||[])];
  const rows=items.map(it=>{
    const c=it.online?'var(--online)':'var(--offline)';
    const meter = it.meter ? `<span class="meter"><span style="width:${it.disk_pct||0}%;background:${c}"></span></span><span class="val">${it.disk_pct!=null?it.disk_pct+'%':''}</span>`
                           : `<span class="val">${it.online?'up':'down'}</span>`;
    return `<div class="row"><span class="dot" style="color:${c}">&#9679;</span><span class="nm">${it.name}${it.uptime?` &middot; ${it.uptime}`:''}</span>${meter}</div>`;
  }).join('');
  const when = s.demo ? 'demo data &mdash; not live yet' : (s.updated?('updated '+new Date(s.updated).toLocaleString()):'');
  return `<div class="readout">${rows}</div>
    <div class="stamp">${when}</div>
    <div class="links"><button class="btn ghost" id="wsRefresh">Refresh</button></div>`;
}

/* ---- modal + hash routing ---- */
const bg=document.getElementById('modalBg'), mTag=document.getElementById('mTag'),
      mTitle=document.getElementById('mTitle'), mBody=document.getElementById('mBody'),
      mClose=document.getElementById('mClose');
let lastFocus=null;

function wireRefresh(){
  const rf=document.getElementById('wsRefresh');
  if(rf) rf.addEventListener('click',async()=>{
    rf.textContent='Refreshing…';
    await loadStatus();
    if(location.hash.slice(1)==='workshop'){ mBody.innerHTML=SECTIONS.workshop.body(); wireRefresh(); }
  });
}
function openSection(key){
  const s=SECTIONS[key]; if(!s) return closeModal();
  mTag.textContent=s.tag; mTitle.textContent=s.title; mBody.innerHTML=s.body();
  bg.classList.add('open');
  lastFocus=document.querySelector(`.hotspot[data-key="${key}"]`);
  mClose.focus();
  wireRefresh();
}
function closeModal(){ bg.classList.remove('open'); if(lastFocus){lastFocus.focus(); lastFocus=null;} }

function route(){ const key=location.hash.slice(1); key&&SECTIONS[key]?openSection(key):closeModal(); }
window.addEventListener('hashchange',route);

document.querySelectorAll('.hotspot').forEach(h=>{
  const go=()=>{ location.hash=h.dataset.key; };
  h.addEventListener('click',go);
  h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} });
});
mClose.addEventListener('click',()=>location.hash='');
bg.addEventListener('click',e=>{ if(e.target===bg) location.hash=''; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&bg.classList.contains('open')) location.hash=''; });

/* boot */
loadStatus().then(route);
</script>
</body>
</html>
